server_tokens off;

server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate     /certs/cert.pem;
    ssl_certificate_key /certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 2k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 15s;

    # Cabeceras de seguridad
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    # Solo se permiten los métodos necesarios
    if ($request_method !~ ^(GET|HEAD|POST)$) {
        return 405;
    }

    # API del backend. Solo POST /api/chat y GET /api/health.
    location = /api/chat {
        limit_except POST { deny all; }
        proxy_pass https://backend:8443;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 180s;
        proxy_hide_header Server;
    }

    location = /api/health {
        limit_except GET { deny all; }
        proxy_pass https://backend:8443;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Cualquier otra ruta /api/ no existe
    location /api/ {
        return 404;
    }

    # Archivos estáticos: solo GET/HEAD
    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri /index.html;
    }

    # Ocultar archivos ocultos (p. ej. .env) aunque existan en la imagen
    location ~ /\. {
        deny all;
        return 404;
    }
}
