# Proxy TLS delante de MongoDB (stream, sin HTTP).
# Comparte la pila de red del contenedor fmc130-mongodb (network_mode: service:mongodb),
# así que "127.0.0.1:27017" es el mongod de la imagen Atlas Local, que no admite TLS.
# El tráfico cifrado llega al puerto 27443; el tramo proxy -> mongod nunca sale del contenedor.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

stream {
    server {
        listen 27443 ssl;

        ssl_certificate     /certs/mongo-cert.pem;
        ssl_certificate_key /certs/mongo-key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   off;
        ssl_session_tickets off;

        proxy_pass 127.0.0.1:27017;
        proxy_connect_timeout 5s;
        proxy_timeout 10m;
    }
}
