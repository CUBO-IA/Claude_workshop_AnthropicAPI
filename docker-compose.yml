x-hardening: &hardening
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  read_only: true
  restart: unless-stopped

networks:
  fmc130-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

services:
  mongodb:
    image: mongodb/mongodb-atlas-local:latest
    container_name: fmc130-mongodb
    networks:
      fmc130-net:
        ipv4_address: 172.30.0.5
    ports:
      - "127.0.0.1:${MONGODB_HOST_PORT:-27040}:27017"
    environment:
      MONGODB_INITDB_ROOT_USERNAME: ${MONGODB_ROOT_USERNAME:-admin}
      MONGODB_INITDB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD:?Define MONGODB_ROOT_PASSWORD en .env}
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    <<: *hardening
    build:
      context: ./backend
    container_name: fmc130-backend
    depends_on:
      mongodb:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Dentro de la red de compose el host es el nombre del servicio, no localhost.
      MONGODB_URI: mongodb://${MONGODB_ROOT_USERNAME:-admin}:${MONGODB_ROOT_PASSWORD}@172.30.0.5:27017/?authSource=admin&directConnection=true
      CORS_ORIGINS: https://localhost:${FRONTEND_HOST_PORT:-4443}
      TRUSTED_PROXIES: 172.30.0.10/32
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-100}
      ENABLE_DOCS: "false"
    networks:
      fmc130-net:
        ipv4_address: 172.30.0.20
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8453}:8443"
    tmpfs:
      - /tmp
    volumes:
      - ./certs:/certs:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import ssl,urllib.request as u; u.urlopen('https://localhost:8443/api/health', context=ssl._create_unverified_context(), timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 5

  frontend:
    <<: *hardening
    build:
      context: ./frontend
    container_name: fmc130-frontend
    depends_on:
      backend:
        condition: service_healthy
    networks:
      fmc130-net:
        ipv4_address: 172.30.0.10
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-4443}:8443"
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    volumes:
      - ./certs:/certs:ro

volumes:
  mongo-data:
  mongo-config:
